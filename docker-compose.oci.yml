# ===========================================
# bela360 - OCI shared-host Docker Compose
# ===========================================
# Para deploy na OCI compartilhada (nginx-proxy externo faz o roteamento
# por subpath /bela360/ e /bela360-api/, alcancando os containers pelo
# nome via rede Docker). Sem nginx proprio, sem bind de porta no host.
#
# Uso: docker compose -f docker-compose.oci.yml up -d --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: bela360-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bela360-network

  redis:
    image: redis:7-alpine
    container_name: bela360-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bela360-network

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: production
    container_name: bela360-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PLATFORM_ADMIN_JWT_SECRET=${PLATFORM_ADMIN_JWT_SECRET}
      - PLATFORM_ADMIN_JWT_REFRESH_SECRET=${PLATFORM_ADMIN_JWT_REFRESH_SECRET}
      - EVOLUTION_API_URL=http://batuara-evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bela360-network
      - evolution-shared

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_BASE_PATH=/bela360
    container_name: bela360-web
    restart: always
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - bela360-network

networks:
  bela360-network:
    driver: bridge
  evolution-shared:
    external: true
    name: docker_evolution-network

volumes:
  postgres_data:
  redis_data:
