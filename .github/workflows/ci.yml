name: CI - Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: Build & Lint (api + web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bela360
          POSTGRES_PASSWORD: bela360_ci
          POSTGRES_DB: bela360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bela360"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Apply migrations (CI database)
        env:
          DATABASE_URL: postgresql://bela360:bela360_ci@localhost:5432/bela360
        run: pnpm --filter api exec prisma migrate deploy

      # continue-on-error: ha debito de lint pre-existente no codigo (40
      # erros, principalmente @typescript-eslint/no-unused-vars) que nao
      # faz parte deste CI/CD - roda e reporta, mas nao bloqueia o build.
      - name: Lint api
        run: pnpm --filter api lint
        continue-on-error: true

      - name: Lint web
        run: pnpm --filter web lint
        continue-on-error: true

      - name: Unit tests (api)
        run: pnpm --filter api exec vitest run

      - name: Build shared package
        run: pnpm --filter @bela360/shared build

      - name: Build api
        run: pnpm --filter api build

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: pnpm --filter web build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build-and-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/api/Dockerfile --target production -t bela360-api:ci .

      - name: Build Web image
        run: >
          docker build -f docker/web/Dockerfile --target production
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001
          -t bela360-web:ci .

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start bela360 stack (dev compose + nginx de subpath para E2E)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=200 api
          exit 1

      - name: Apply database migrations
        run: docker compose exec -T api pnpm --filter api exec prisma migrate deploy

      - name: Wait for web + nginx readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8091/bela360; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=200 web nginx-e2e
          exit 1

      - name: Run Playwright suite
        run: >
          docker run --rm --network host
          -v "${{ github.workspace }}/tests/e2e:/workspace"
          -w /workspace
          -e BASE_URL=http://127.0.0.1:3001
          -e WEB_URL=http://127.0.0.1:8091/bela360
          -e REDIS_URL=redis://127.0.0.1:6379
          -e CI=true
          mcr.microsoft.com/playwright:v1.61.1-noble
          sh -c "npm ci --no-fund && npx playwright test"

      - name: Show API logs
        if: always()
        run: docker compose logs --tail=300 api

      - name: Stop bela360 stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
