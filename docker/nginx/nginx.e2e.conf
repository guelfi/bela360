# Nginx minimo usado so pelo job de E2E (docker-compose.e2e.yml), para
# reproduzir o mesmo roteamento de subpath usado em producao
# (/bela360 -> web, /bela360/api -> api) sem precisar do nginx-proxy
# compartilhado. Espelha exatamente os blocos "bela360" do
# nginx.conf real de producao.
events {}

http {
  server {
    listen 80;

    location = /bela360 {
      proxy_pass http://web:3000/bela360;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bela360/ {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bela360/api/ {
      rewrite ^/bela360/api/(.*)$ /api/$1 break;
      proxy_pass http://api:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
